name: format

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

# a new commit cancels the superseded run for the same branch
concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: uncrustify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install uncrustify
        shell: bash
        run: |
          rm -f build.log
          set -o pipefail
          # apt can fail transiently on the hosted runners: it must never
          # block the engine patches below, the format pass just reports
          # the missing binary per file
          sudo apt-get update -qq 2>&1 | tee -a build.log || true
          sudo apt-get install -y -qq uncrustify 2>&1 | tee -a build.log || true
      - name: format
        shell: bash
        run: |
          # run per file: a crash on one file must not abort the whole tree
          echo "diag format: begin, uncrustify=$( command -v uncrustify || echo missing )" >> build.log
          find src -regextype posix-extended -path src/third-party -prune -o -type f ! -name qasm.h ! -name bg_pmove.c -regex '.*\.(c|h|cpp|hpp)$' -print > files.txt
          while read -r f; do
            uncrustify -c uncrustify.cfg --replace --no-backup "$f" >> build.log 2>&1 || echo "UNCRUSTIFY_FAILED: $f" >> build.log
          done < files.txt
          rm -f files.txt
          echo "diag format: end" >> build.log
      - name: commit formatting
        shell: bash
        run: |
          echo "diag commit-formatting: begin" >> build.log
          git status --short >> build.log 2>&1 || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- src; then
            # only formatted sources belong in the tree, never the local
            # build.log or stray uncrustify scratch files
            find src -name '*.uncrustify' -delete
            git add src
            git commit -m "uncrustify: format tree [skip ci]"
            # the checkout is detached, so the refspec must name the
            # branch explicitly; -X theirs: on a push race the newest
            # output wins instead of committing conflict markers
            pushed=0
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then
                pushed=1
                break
              fi
              git fetch origin "${GITHUB_REF_NAME}" || break
              git rebase -X theirs "FETCH_HEAD" || break
            done
            echo "diag commit-formatting: push attempts done, pushed=$pushed" >> build.log
            test "$pushed" = 1
          fi
          echo "diag commit-formatting: end" >> build.log
      - name: digest
        if: always()
        shell: bash
        env:
          LEG: uncrustify
          STATUS: ${{ job.status }}
        run: |
          echo "diag digest: leg=$LEG status=$STATUS" >> build.log
          cp build.log "log-$LEG.log" 2>/dev/null || true
          echo "${LEG}|${STATUS:-failure}" > "status-${LEG}"
          python .github/scripts/digest.py || true
          ls -la >> build.log 2>&1 || true
      - name: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-uncrustify
          path: |
            log-uncrustify.log
            digest-fragment-uncrustify.md
            status-uncrustify
          if-no-files-found: ignore
